name: Fork Release

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'SaraVieira/argosy-launcher'
    runs-on: ubuntu-latest
    env:
      TITLEDB_API_SECRET: ${{ secrets.TITLEDB_API_SECRET }}
      CHEATSDB_API_SECRET: ${{ secrets.CHEATSDB_API_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APKs
        run: >
          ./gradlew assembleRelease -PallAbis
          -Pkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs="-Xmx12g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

      - name: Check tag matches the built version
        id: version
        run: |
          out=app/build/outputs/apk/release
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          version=$("$aapt2" dump badging "$out/app-universal-release.apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the built versionName $version (expected tag v$version)"
            exit 1
          fi
          suffix=$(echo "$version" | sed -n 's/^[^-]*-//p' | tr 'A-Z' 'a-z' | sed 's/[^a-z].*//')
          case "$suffix" in
            alpha|beta|rc|pre|preview|dev|nightly|snapshot|eap|canary) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Rename published APKs
        run: |
          out=app/build/outputs/apk/release
          v=${{ steps.version.outputs.version }}
          mkdir -p dist
          cp "$out/app-universal-release.apk" "dist/argosy-v$v.apk"
          cp "$out/app-arm64-v8a-release.apk" "dist/argosy-v$v-arm64.apk"
          cp "$out/app-armeabi-v7a-release.apk" "dist/argosy-v$v-arm32.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--verify-tag --title $GITHUB_REF_NAME --generate-notes"
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            flags="$flags --prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.apk $flags
